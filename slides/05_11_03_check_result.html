    這個行動帶來的效應是什麼？<br/>

    而不是「她是不是討厭我？」「她是不是想跟我絕交？」<br/>
    <br/>
    這樣的思考方式，讓我更能夠冷靜地面對情緒，而不是被情緒牽著走。<br/>
    <br/>
    接下來也想和大家聊某個現象，我相信每個人多少都有。<br/>
