<section data-background-color="#78c2c4">
  <h4 class="title">一旦要做一件事，就會希望它馬上完美。</h4>
  <h2 class="title fragment fade-in">➡️ 拖延症？</h2>
  <aside class="notes">
    那就是「一旦要做一件事，就會希望它馬上進入一個完美的狀態」。<br/>
    如：英文變得非常好、體態變得很健康、工作變得很順利等等。<br/>
    <br/>
    我也是。<br/>
    我以前的習慣是，一旦要做一件事，就會希望它馬上完美。<br/>
    但教練過程中，我慢慢意識到：這樣的期待，其實會讓我無法開始。<br/>
    <br/>
    這大概就是大家最常聽到的「拖延症」的一個面向，因為太想要完美導致不敢開始。
  </aside>
</section>
